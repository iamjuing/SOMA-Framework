name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows MinGW
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check preinstalled tools
        run: |
          gcc --version
          g++ --version
          cmake --version
          ninja --version

      - name: Configure unit tests
        run: cmake -S . -B build/ci-test -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build unit tests
        run: cmake --build build/ci-test --target soma_tests

      - name: Configure Windows example
        run: cmake -S example/platform/windows -B build/ci-example -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++

      - name: Build Windows example
        run: cmake --build build/ci-example --target soma_example

      - name: Run unit tests
        run: ctest --test-dir build/ci-test --output-on-failure --no-tests=error
